# Include ONLY inside tonsuite.org's HTTPS VirtualHost.
ProxyPass /generator/rpc/ http://127.0.0.1:18796/generator/rpc/ retry=0 timeout=30
ProxyPassReverse /generator/rpc/ http://127.0.0.1:18796/generator/rpc/
SetEnvIf Request_URI "^/generator/rpc/" tonsuite_rotation_rpc
# The VirtualHost CustomLog must use env=!tonsuite_rotation_rpc.
<Location /generator/rpc/>
    Header always set Cache-Control "no-store"
    Header always set Referrer-Policy "no-referrer"
</Location>
