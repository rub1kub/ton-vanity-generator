# Included in Nginx's http context. Apache exposes this listener ONLY on
# tonsuite.org/generator/rpc/. No API key is stored in the repository/web root.
limit_req_zone $binary_remote_addr zone=tonsuite_rotation_ip:10m rate=3r/s;
limit_req_zone $server_name zone=tonsuite_rotation_total:1m rate=8r/s;

server {
    listen 127.0.0.1:18796;
    server_name tonsuite-generator-rpc;
    access_log off;
    error_log /var/log/nginx/tonsuite-generator-rpc-error.log warn;
    client_max_body_size 32k;
    client_body_timeout 10s;

    # Apache appends the actual client IP; only the local Apache hop is trusted.
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    location ~ ^/generator/rpc/(getAddressInformation|getConfigParam|estimateFee|sendBoc)$ {
        if ($request_method != POST) { return 405; }
        if ($args != "") { return 400; }
        limit_req zone=tonsuite_rotation_ip burst=6 nodelay;
        limit_req zone=tonsuite_rotation_total burst=16 nodelay;
        limit_req_status 429;

        rewrite ^/generator/rpc/(.*)$ /api/v2/$1 break;
        proxy_pass https://toncenter.com;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass_request_headers off;
        proxy_set_header Host toncenter.com;
        proxy_set_header Content-Type application/json;
        proxy_set_header User-Agent "TonSuite-WalletTg-Rotation";
        include /etc/nginx/tonsuite-secrets/toncenter-header.conf;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
        proxy_send_timeout 25s;
        proxy_next_upstream off; # Never automatically replay sendBoc.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location / { return 404; }
}
